server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin CORS proxy is provided by Vercel / dev server.
    # In Docker (nginx) there is no serverless function, so return 404 with CORS
    # headers so the frontend can fall back to direct request or local proxy.
    location /api/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "*" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "*" always;
        # OPTIONS preflight for /api/*
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "*";
            add_header Access-Control-Allow-Headers "*";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        # No serverless proxy in nginx image - return 404 so client can fallback
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
